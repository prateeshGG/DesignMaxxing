<!doctype html>
<meta charset="utf-8">
<title>Film: closing wall</title>
<link rel="stylesheet" href="film.css">
<style>
  .tile { border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .tile img { left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .vig { inset: 0; background: radial-gradient(70% 70% at 50% 50%, rgba(11,20,36,0) 30%, rgba(11,20,36,.85) 100%); z-index: 20; }
</style>
<div id="stage" style="background:#0b1424">
  <div id="pat" style="inset:0"></div>
</div>
<script src="engine.js"></script>
<script>
(function () {
  var S = document.getElementById('stage'), e = F.e, lerp = F.lerp;
  var pat = F.canvas(document.getElementById('pat'));
  var LIST = ['stripe-hero', 'linear-hero', 'studio-hero', 'stripe-bento1', 'linear-changelog', 'studio-case', 'stripe-stats', 'stripe-banner', 'linear-testimonials', 'linear-figures', 'studio-logos', 'linear-cta', 'p-burst', 'p-bento2'];
  var COLS = 7, ROWS = 5, TW = 360, TH = 225, G = 28;
  var wall = F.el(S, 'div', '', 'left:0;top:0;transform-origin:0 0;z-index:5');
  var r = F.rand(7);
  for (var i = 0; i < COLS * ROWS; i++) {
    var c = i % COLS, rr = Math.floor(i / COLS);
    var tdiv = F.el(wall, 'div', 'tile', 'left:' + (c * (TW + G) + (rr % 2 ? TW * .35 : 0)) + 'px;top:' + (rr * (TH + G)) + 'px;width:' + TW + 'px;height:' + TH + 'px');
    F.img(tdiv, '../prototype/img/' + LIST[Math.floor(r() * LIST.length)] + '.webp');
  }
  F.el(S, 'div', 'vig');
  F.grain(S, 0.08);
  var WW = COLS * (TW + G), WH = ROWS * (TH + G);
  var FX = 3 * (TW + G) + TW * .35 + TW / 2, FY = 2 * (TH + G) + TH / 2; // the focus tile's centre
  function render(t) {
    F.pattern(pat, t, { kind: 'dots', color: '#9fb0ff', alpha: .16, gap: 30, vx: 3, r: 1.2 });
    var z = e(t, 0.4, 6.0) * (1 - e(t, 10.2, 14));
    var s = lerp(2.2, 0.62, z);
    var drift = 60 * Math.sin(t * Math.PI / 7) * z;
    var tx = 720 - FX * s + drift, ty = 450 - FY * s;
    wall.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  }
  F.boot(14, render);
})();
</script>
