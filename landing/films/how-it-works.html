<!doctype html>
<meta charset="utf-8">
<title>Film: how it works</title>
<link rel="stylesheet" href="film.css">
<style>
  .seg-ph { border: 2px dashed rgba(47,85,255,.35); border-radius: 6px; background: rgba(230,235,255,.55); }
  .br { border: 2.5px solid var(--blue); border-right: 0; border-radius: 10px 0 0 10px; width: 12px; transform-origin: 50% 50%; }
  .lb { transform: translate(-100%, -50%); }
  .tags { display: flex; gap: 6px; }
  .tags span { position: static; }
  .tags .pill { font-size: 12px; padding: 6px 10px; }
  .bar-in { left: 26px; top: 0; height: 100%; display: flex; align-items: center; gap: 16px; font: 400 24px/1 "Geist", sans-serif; color: var(--ink); white-space: nowrap; }
  .bar-in * { position: static; }
  .caret { display: inline-block; width: 2px; height: 28px; background: var(--blue); margin-left: 2px; vertical-align: -5px; }
  .res-cap { left: 0; right: 0; bottom: 0; height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-top: 1px solid rgba(10,11,13,.06); }
  .res-cap * { position: static; }
  .meta { display: flex; gap: 10px; }
  .meta * { position: static; }
</style>
<div id="stage">
  <div id="bg" style="inset:0"></div>
  <div id="art" style="inset:0"></div>
  <div id="pat" style="inset:0"></div>
</div>
<script src="engine.js"></script>
<script>
(function () {
  var S = document.getElementById('stage'), e = F.e, seg = F.seg, lerp = F.lerp;
  var bg = document.getElementById('bg');
  var art = F.canvas(document.getElementById('art')), patA = F.canvas(document.getElementById('pat')), patB = F.canvas(document.getElementById('pat'));

  /* ---- act 1: a page, bracketed, its sections lifted out and tagged ---- */
  var SEGS = [['stripe-hero', .4227, 'Hero', ['hero', 'light', 'desktop']], ['stripe-logos', .0367, 'Logo row', null], ['p-bento1', .449, 'Feature grid', ['feature grid', 'gradient']], ['p-banner', .291, 'Video banner', ['banner', 'dark']], ['p-stats', .245, 'Stats', ['stats', 'light']]];
  var PW = 440, PX0 = 500, PX1 = 230, CW = 420, CX = 880;
  var ph = SEGS.map(function (s) { return Math.round(s[1] * PW); }), PH = ph.reduce(function (a, b) { return a + b; }, 0), PY = Math.round((900 - PH) / 2);
  var page = F.el(S, 'div', 'card', 'z-index:5;border-radius:14px'), pageImgs = [], slots = [], brs = [], lbs = [], cards = [], tagEls = [];
  var acc = 0;
  SEGS.forEach(function (s, i) {
    var im = F.img(page, '../prototype/img/' + s[0] + '.webp', '', 'left:0;width:' + PW + 'px;height:' + ph[i] + 'px;top:' + acc + 'px;object-fit:cover');
    pageImgs.push(im);
    slots.push(F.el(page, 'div', 'seg-ph', 'left:3px;width:' + (PW - 6) + 'px;top:' + (acc + 2) + 'px;height:' + Math.max(8, ph[i] - 4) + 'px;opacity:0'));
    brs.push(F.el(S, 'div', 'br', 'z-index:6'));
    var lb = F.el(S, 'div', 'pill blue lb', 'z-index:7;font-size:12px;padding:7px 11px'); lb.textContent = s[2]; lbs.push(lb);
    var c = F.el(S, 'div', 'card', 'z-index:8;border-radius:12px'); F.img(c, '../prototype/img/' + s[0] + '.webp'); cards.push(c);
    var tg = F.el(S, 'div', 'tags flow', 'z-index:9'); if (s[3]) s[3].forEach(function (x) { var p = document.createElement('span'); p.className = 'pill'; p.textContent = x; tg.appendChild(p); }); tagEls.push(tg);
    acc += ph[i];
  });
  F.box(page, PX0, PY, PW, PH);
  var ch = SEGS.map(function (s) { return Math.round(s[1] * CW); }), GAP = 18, CH = ch.reduce(function (a, b) { return a + b; }, 0) + GAP * (SEGS.length - 1), CY = Math.round((900 - CH) / 2) + 20;
  var counter = F.el(S, 'div', 'pill lime', 'z-index:9'); counter.textContent = '5 sections · tagged';

  /* ---- act 2: soft search bar and results ---- */
  var bar = F.el(S, 'div', 'soft-bar', 'z-index:20;width:780px;height:76px');
  var barIn = F.el(bar, 'div', 'bar-in flow');
  barIn.innerHTML = "<svg viewBox='0 0 24 24' width='26' height='26' fill='none' stroke='#2f55ff' stroke-width='2'><circle cx='11' cy='11' r='6.5'/><path d='M16 16l4.5 4.5'/></svg><span id='q'></span><span class='caret' id='caret'></span>";
  var qEl = document.getElementById('q'), caret = document.getElementById('caret');
  var cnt = F.el(bar, 'div', 'pill', 'right:16px;top:20px;font-size:12px;padding:8px 12px;box-shadow:none;background:var(--blue-soft);color:var(--blue)');
  var RES = [['stripe-hero', 'Hero', 'stripe.com'], ['linear-hero', 'Hero', 'linear.app'], ['studio-hero', 'Hero', 'studio site']];
  var RW = 380, RH = 238, RX0 = (1440 - (RW * 3 + 28 * 2)) / 2, RY = 330, res = [];
  RES.forEach(function (r, i) {
    var c = F.el(S, 'div', 'card', 'z-index:12');
    F.img(c, '../prototype/img/' + r[0] + '.webp', '', 'height:calc(100% - 44px)');
    var cap = F.el(c, 'div', 'res-cap flow'); cap.innerHTML = "<span class='label' style='color:#0a0b0d'>" + r[1] + "</span><span class='label'>" + r[2] + "</span>";
    res.push(c);
  });
  var cur = F.cursor(S);

  /* ---- act 3: one section opened up ---- */
  var DW = 1000, DH = Math.round(DW * 541 / 1280), DX = 220, DY = 160;
  var HOT = [[.69, .405, 'Headline', 0], [.84, .62, 'Gradient art', 1], [.335, .745, 'One call to action', 0]], hots = [];
  HOT.forEach(function (h) { var d = F.el(S, 'div', 'dot', 'z-index:30'); var p = F.el(S, 'div', 'pill', 'z-index:30;font-size:13px'); p.textContent = h[2]; hots.push([d, p]); });
  var meta = F.el(S, 'div', 'meta flow', 'z-index:30');
  meta.innerHTML = "<span class='pill'>Hero</span><span class='pill'>Light</span><span class='pill'>Desktop</span><span class='pill lime'>Source · stripe.com ↗</span>";

  F.grain(S, 0.06);
  var QUERY = 'hero with a product visual';

  function render(t) {
    /* background: cream -> soft lime -> peach, art and pattern change with the act */
    var b1 = e(t, 5.9, 6.7), b2 = e(t, 11.3, 12.2);
    bg.style.background = b2 > 0 ? F.mix('#eef5cf', '#ffeadb', b2) : F.mix('#faf8f3', '#eef5cf', b1);
    F.engrave(art, t, { color: b2 > .5 ? '#c86a32' : (b1 > .5 ? '#7f9a1f' : '#2f55ff'), alpha: .5, spacing: 8, amp: 30, lw: 1.2, mask: { x: 1380, y: 860, r: 820 } });
    patA.canvas.style.opacity = b1 * (1 - b2); patB.canvas.style.opacity = b2;
    F.pattern(patA, t, { kind: 'dots', color: '#7f9a1f', alpha: .35, gap: 38, vx: 10 });
    F.pattern(patB, t, { kind: 'diamonds', color: '#e07a3f', alpha: .3, gap: 44, vx: -8, r: 2.4, stagger: true });

    /* act 1 */
    var a1o = 1 - e(t, 5.9, 6.5);
    var pin = e(t, 0, .8, 'out'), glide = e(t, .8, 1.7);
    var px = lerp(PX0, PX1, glide);
    F.box(page, px, PY); F.show(page, pin * a1o, 'scale(' + lerp(.94, 1, pin) + ')');
    var acc = 0;
    SEGS.forEach(function (s, i) {
      var top = PY + acc, h = ph[i];
      var sb = e(t, 1.8 + i * .25, 2.25 + i * .25, 'back');
      F.box(brs[i], px - 20, top + 2, undefined, Math.max(10, h - 4)); F.show(brs[i], F.clamp(sb * 1.2) * a1o * (1 - e(t, 4.9, 5.3)), 'scaleY(' + sb + ')');
      F.box(lbs[i], px - 30, top + h / 2); F.show(lbs[i], seg(t, 1.9 + i * .25, 2.2 + i * .25) * a1o * (1 - e(t, 4.9, 5.3)), 'translate(-100%,-50%) scale(' + lerp(.8, 1, sb) + ')');
      /* lift: card leaves the page slot and lands in the column */
      var lt = e(t, 3.0 + i * .28, 3.9 + i * .28), cy = CY;
      for (var k = 0; k < i; k++) cy += ch[k] + GAP;
      var x = lerp(px, CX, lt), y = lerp(top, cy, lt), w = lerp(PW, CW, lt), hh = lerp(h, ch[i], lt), lift = Math.sin(Math.PI * lt);
      F.box(cards[i], x, y - lift * 18, w, hh); F.show(cards[i], (lt > 0 ? 1 : 0) * a1o, 'scale(' + (1 + lift * .04) + ')');
      cards[i].style.boxShadow = 'var(--card-shadow)';
      F.show(slots[i], lt * a1o);
      var tg = e(t, 4.4 + i * .12, 4.8 + i * .12, 'back');
      F.box(tagEls[i], CX + CW - 12, cy + 10); F.show(tagEls[i], F.clamp(tg) * a1o, 'translateX(-100%) scale(' + lerp(.85, 1, tg) + ')');
      tagEls[i].style.transformOrigin = '100% 0';
      acc += h;
    });
    var co = e(t, 4.9, 5.3, 'back');
    F.box(counter, CX, CY - 52); F.show(counter, F.clamp(co) * a1o, 'scale(' + lerp(.8, 1, co) + ')');

    /* act 2 */
    var bin = e(t, 6.1, 6.9, 'out'), bout = e(t, 11.3, 11.9);
    F.box(bar, (1440 - 780) / 2, lerp(-100, 190, bin) - bout * 40); F.show(bar, bin * (1 - bout));
    qEl.textContent = F.type(QUERY, t, 7.0, 8.4);
    caret.style.opacity = (Math.floor(t * 2.2) % 2 === 0 || (t > 7 && t < 8.4)) ? 1 : 0;
    var found = seg(t, 8.6, 8.8);
    cnt.textContent = found > 0 ? '3 results' : 'all sections';
    res.forEach(function (c, i) {
      var r = e(t, 8.6 + i * .15, 9.3 + i * .15, 'back');
      var x = RX0 + i * (RW + 28), y = RY, w = RW, h = RH + 44, o = F.clamp(r);
      if (i === 0) {
        var m = e(t, 11.3, 12.3);
        x = lerp(x, DX, m); y = lerp(y, DY, m); w = lerp(RW, DW, m); h = lerp(RH + 44, DH + 44, m);
        F.box(c, x, y + (1 - F.clamp(r)) * 40, w, h);
        c.style.borderRadius = lerp(18, 20, m) + 'px';
        var push = 1 + .02 * e(t, 14, 16);
        F.show(c, o, 'scale(' + push + ')');
      } else {
        F.box(c, x, y + (1 - F.clamp(r)) * 40, w, h); F.show(c, o * (1 - e(t, 11.1, 11.6)), 'scale(' + lerp(.92, 1, F.clamp(r)) * (1 - .04 * e(t, 11.1, 11.6)) + ')');
      }
    });
    /* cursor: travels to the first result and clicks */
    var cin = seg(t, 9.6, 9.9) * (1 - seg(t, 11.6, 11.9)), mv = e(t, 9.8, 10.8);
    var cxp = lerp(1180, RX0 + RW * .5, mv), cyp = lerp(800, RY + RH * .55, mv);
    F.click(cur, cxp, cyp, t, 11.0); cur.el.style.opacity = cin;

    /* act 3 */
    var push = 1 + .02 * e(t, 14, 16), ccx = DX + DW / 2, ccy = DY + (DH + 44) / 2;
    HOT.forEach(function (h, i) {
      var o = e(t, 12.5 + i * .45, 12.9 + i * .45, 'back');
      var X = ccx + (DX + h[0] * DW - ccx) * push, Y = ccy + (DY + h[1] * DH - ccy) * push;
      F.box(hots[i][0], X, Y); F.show(hots[i][0], F.clamp(o), 'scale(' + o + ')');
      F.box(hots[i][1], X + (h[3] ? -20 : 20), Y); F.show(hots[i][1], F.clamp(o), 'translate(' + (h[3] ? '-100%' : '0') + ',-50%) scale(' + lerp(.8, 1, F.clamp(o)) + ')');
    });
    var mo = e(t, 13.6, 14.2, 'out');
    F.box(meta, DX, DY + DH + 44 + 30 + (1 - mo) * 16); F.show(meta, mo);
  }
  F.boot(16, render);
})();
</script>
